[project]
name = "allelion-verdict-ai"
version = "1.0.0"
description = "ACMG/AMP germline variant interpretation with calibrated evidence, a verified evidence copilot and a blind expert panel evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "gensim>=4.3",
  "sklearn-crfsuite>=0.5",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "biopython>=1.83"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["allelion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
